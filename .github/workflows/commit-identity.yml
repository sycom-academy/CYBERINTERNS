name: commit-identity

# Every commit that reaches main is public forever, and so is every email
# address in it: pull requests are squash-merged, and GitHub copies the author
# of every commit on the branch into the squash commit as a Co-authored-by
# line. This job checks every commit on every pull request, from a fork or
# from a branch of this repository, before that can happen.
#
# A commit passes when its author and committer emails are each either a
# GitHub noreply address or one of the programme's own public addresses in
# ALLOWED_EMAILS. Anything else, such as a personal or university address, fails.
#
# That covers mentors too. A mentor's "Update branch" click on a pull request
# creates a commit under their GitHub account email, which then lands on main
# as a Co-authored-by line. Mentors turn on "Keep my email addresses private"
# (https://github.com/settings/emails) so that those commits use their noreply
# address.
#
# JOINING.md §3 step 8 needs a person for the other half: the job lists every
# author name in its summary so the reviewing mentor can confirm it is the
# name the intern chose to make public (mode A) or their pseudonym (mode B).

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: commit-identity
    runs-on: ubuntu-latest
    steps:
      - name: Check commit author and committer emails
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          # Programme addresses that are already public. Space-separated.
          ALLOWED_EMAILS: "hello@sycomsolutions.com noreply@anthropic.com"
        run: |
          set -euo pipefail

          allowed() {
            case "$1" in
              *@users.noreply.github.com|noreply@github.com) return 0 ;;
            esac
            for a in $ALLOWED_EMAILS; do
              [ "$1" = "$a" ] && return 0
            done
            return 1
          }

          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/commits" \
            --jq '.[] | [.sha[0:7], .commit.author.name, .commit.author.email, .commit.committer.email] | @tsv' \
            > commits.tsv

          {
            echo "### Commit identities on this pull request"
            echo
            echo "Check that each **author name** is the name its author chose to make public."
            echo
            echo "| Commit | Author name | Author email | Committer email | OK |"
            echo "|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          bad=0
          while IFS=$'\t' read -r sha name email cemail; do
            ok=yes
            allowed "$email" || ok=no
            allowed "$cemail" || ok=no
            if [ "$ok" = no ]; then
              bad=$((bad + 1))
              echo "::error::Commit ${sha} uses an email that is not a noreply or programme address (author ${email}, committer ${cemail})."
            fi
            echo "| \`${sha}\` | ${name} | ${email} | ${cemail} | ${ok} |" >> "$GITHUB_STEP_SUMMARY"
          done < commits.tsv

          if [ "$bad" -gt 0 ]; then
            {
              echo
              echo "**${bad} commit(s) would publish a personal email address on main.** Do not merge."
              echo "Interns: start a fresh branch with corrected commits (INTERN-ONBOARDING.md §1)."
              echo "Mentors: turn on \"Keep my email addresses private\" at https://github.com/settings/emails,"
              echo "then replace the offending commit (for a merge from main, reset the branch and update it again)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "All commit emails are noreply or programme addresses."
