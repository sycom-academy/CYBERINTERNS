name: secret-scan

# Replacement for GitHub's native secret scanning, which requires GitHub
# Advanced Security and is not available on this private repository.
#
# Runs the gitleaks BINARY directly rather than gitleaks-action, because
# gitleaks-action requires a paid GITLEAKS_LICENSE when the repository is
# owned by an organisation — which is where this repo is heading.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  # Bump deliberately; a floating version means CI changes under you.
  GITLEAKS_VERSION: "8.18.4"

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan working tree
        shell: bash
        run: |
          set -euo pipefail
          gitleaks detect \
            --no-git \
            --source . \
            --config "${GITHUB_WORKSPACE}/.gitleaks.toml" \
            --redact \
            --report-format json \
            --report-path /tmp/gitleaks-tree.json \
            --exit-code 1 \
            --verbose

      # gitleaks reads text. A .docx or .xlsx is a zip of XML, so a credential
      # pasted into a Word evidence pack is invisible to it. Unpack them first.
      - name: Unpack Office documents
        id: unpack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/office-text
          count=0
          while IFS= read -r -d '' f; do
            dest="/tmp/office-text/$(printf '%s' "$f" | tr '/ ' '__')"
            mkdir -p "$dest"
            if unzip -qq -o "$f" -d "$dest" 2>/dev/null; then
              count=$((count + 1))
            else
              echo "::warning file=$f::could not unpack; scan it by hand"
            fi
          done < <(find . -path ./.git -prune -o -type f \
              \( -iname '*.docx' -o -iname '*.xlsx' -o -iname '*.pptx' \
              -o -iname '*.odt' -o -iname '*.ods' -o -iname '*.odp' \) -print0)
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "Unpacked ${count} document(s)."

      - name: Scan unpacked document contents
        if: steps.unpack.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          gitleaks detect \
            --no-git \
            --source /tmp/office-text \
            --config "${GITHUB_WORKSPACE}/.gitleaks.toml" \
            --redact \
            --report-format json \
            --report-path /tmp/gitleaks-docs.json \
            --exit-code 1 \
            --verbose

      - name: Scan git history
        shell: bash
        run: |
          set -euo pipefail
          gitleaks detect \
            --source . \
            --config "${GITHUB_WORKSPACE}/.gitleaks.toml" \
            --redact \
            --log-opts="--all" \
            --report-format json \
            --report-path /tmp/gitleaks-history.json \
            --exit-code 1 \
            --verbose

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-reports
          path: /tmp/gitleaks-*.json
          if-no-files-found: ignore
          retention-days: 30
